services:
  - type: web
    name: medtruth-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: LLM_TIMEOUT
        value: "180"

  - type: web
    name: medtruth-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: BACKEND_HOSTPORT
        fromService:
          type: web
          name: medtruth-api
          property: hostport
