services:
  - type: web
    name: medtruth-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: LLM_BASE_URL
        value: http://host.docker.internal:11434/v1
      - key: LLM_MODEL
        value: llama3.2
      - key: LLM_API_KEY
        value: ollama
      - key: LLM_TIMEOUT
        value: "180"

  - type: web
    name: medtruth-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: BACKEND_HOSTPORT
        fromService:
          type: web
          name: medtruth-api
          property: hostport
